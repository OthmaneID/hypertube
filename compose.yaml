services:
  user_service:
    build: user_service
    container_name: user_service
    env_file: .env
    ports:
      - ${USER_SERVICE_PORT}:${USER_SERVICE_PORT}
    depends_on:
      - redis
      - postgres
    volumes:
      - ./user_service:/app
    restart: always
  movie_service:
    build: movie_service
    container_name: movie_service
    env_file: .env
    ports:
      - ${MOVIE_SERVICE_PORT}:${MOVIE_SERVICE_PORT}
    depends_on:
      - redis
      # - postgres
    volumes:
      - ./movie_service:/app
    restart: always
  
  redis:
    image: redis:latest
    container_name: redis
    restart: always
    ports:
      - 6379:6379
  postgres:
    image: postgres:latest
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - 5432:5432
    volumes:
      - ./postgres:/var/lib/postgresql
  frontend:
    build: frontend
    container_name: frontend
    ports:
      - 3000:3000
    volumes:
      - ./frontend:/app
    env_file:
      - .env
    depends_on:
      - movie_service
      - user_service